name: Gerar PDFs dos slides

on:
  push:
    branches: [main]
    paths:
      - "slide/md/**"
      - "theme/**"
      - "imgs/**"
      - "marp-engine.cjs"
      - "Dockerfile"
      - "compose.yaml"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/**"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build da imagem marp (com cache)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: marp-local:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Subir Kroki (self-hosted)
        run: docker compose up -d kroki mermaid

      - name: Esperar o Kroki responder
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8000/health > /dev/null 2>&1; then
              echo "Kroki pronto."
              exit 0
            fi
            echo "Aguardando Kroki... ($i/30)"
            sleep 2
          done
          echo "Kroki não respondeu a tempo."
          docker compose logs kroki mermaid
          exit 1

      - name: Gerar PDFs
        run: |
          mkdir -p slide/pdf
          export MARP_USER="$(id -u):$(id -g)"
          docker compose run --rm \
            -e KROKI_ENTRYPOINT=http://kroki:8000 \
            marp --html --engine ./marp-engine.cjs --theme-set ./theme/minimalist.css \
            -I slide/md/ -o slide/pdf/ --pdf --allow-local-files

      - name: Publicar como artefato do workflow
        uses: actions/upload-artifact@v5
        with:
          name: slides-pdf
          path: slide/pdf/*.pdf
          retention-days: 30

      - name: Mover a tag "latest" para este commit
        if: github.ref == 'refs/heads/main'
        run: |
          git tag -f latest
          git push -f origin latest

      - name: Publicar/atualizar Release "latest" com os PDFs
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: "Slides (build automático)"
          body: "PDFs gerados automaticamente a partir de ${{ github.sha }}."
          files: slide/pdf/*.pdf
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Parar serviços
        if: always()
        run: docker compose down -v
